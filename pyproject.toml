[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinydl"
version = "0.1.0"
description = "An educational NumPy automatic differentiation library"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "matplotlib"]
compare = ["torch"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
